name: Build Rooki
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Buka rooki-app.zip dan siapkan kerangka
        run: |
          unzip -o rooki-app.zip -d .
          bash tools/prepare.sh 2>&1 | tee prep.log
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Siapkan APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Rooki.apk
      - uses: actions/upload-artifact@v4
        with: { name: Rooki-apk, path: Rooki.apk }
      - name: Rilis (agar APK bisa diunduh langsung dari HP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rooki build ${{ github.run_number }}
          files: Rooki.apk
      - name: Simpan ringkasan error ke repositori
        if: failure()
        run: |
          { echo "== prep"; tail -40 prep.log 2>/dev/null; echo "== build"; grep -nE '^e: |error:|What went wrong|FAILED|Could not' -A3 build.log 2>/dev/null | head -200; } > build-log.txt
          git config user.name "build-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f build-log.txt
          git commit -m "log build gagal [skip ci]" || true
          git push || true
