name: Build Rooki
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Buka rooki-app.zip
        run: unzip -o rooki-app.zip -d .
      - name: Ambil kerangka parser (ganti nama paket jadi tsuki)
        run: |
          git clone --depth 1 https://github.com/KotatsuApp/kotatsu-parsers.git up
          SRC=$(find up -type d -path '*org/koitharu/kotatsu/parsers' | head -1)
          echo "Sumber kerangka: $SRC"
          mkdir -p app/src/main/java/tsuki
          cp -r "$SRC"/. app/src/main/java/tsuki/
          cd app/src/main/java/tsuki
          rm -rf site
          grep -rl 'org.koitharu.kotatsu.parsers' . | xargs sed -i 's/org\.koitharu\.kotatsu\.parsers/tsuki/g'
          grep -rl 'MangaParserSource' . | xargs -r sed -i 's/MangaParserSource/MangaSource/g'
          echo "--- sisa rujukan factory:"; grep -rn 'newParser\|MangaParserFactory' . || true
          find . -name '*.kt' | wc -l
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build
        run: gradle :app:assembleDebug --stacktrace
      - name: Siapkan APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Rooki.apk
      - uses: actions/upload-artifact@v4
        with: { name: Rooki-apk, path: Rooki.apk }
      - name: Rilis (agar APK bisa diunduh langsung dari HP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rooki build ${{ github.run_number }}
          files: Rooki.apk
